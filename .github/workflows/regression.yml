name: Independent app regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout complete validation history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install isolated verification tools
        run: |
          npm install --prefix .private/ci-runtime --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NODE_PATH=$((Resolve-Path -LiteralPath '.private/ci-runtime/node_modules').Path)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          python -m pip install --disable-pip-version-check pdfplumber==0.11.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify available browser and history
        run: |
          $edgePath = @('C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe', 'C:/Program Files/Microsoft/Edge/Application/msedge.exe') | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $edgePath) { throw 'Microsoft Edge is required for the existing browser and PDF checks.' }
          "RENTAL_BROWSER=$edgePath" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          node scripts/check-ci-environment.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run every local regression suite
        run: npm run test:all
      - name: Read generated anonymous PDFs
        run: python tests/validate-print-pdf.py
      - name: Verify generated sources stayed unchanged
        run: |
          git diff --exit-code -- index.html server/Billing.gs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve anonymous verification output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independent-regression-${{ github.run_id }}
          path: |
            test-results/*.log
            test-results/*results.json
            test-results/browser-suite-summary.json
            test-results/print-pdf-validation.json
            test-results/print-pdf-*/*.pdf
          if-no-files-found: warn
          retention-days: 7
